<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <meta name="description" content="7-day weather forecast for any city" />
    <meta name="theme-color" content="#bae6fd" />
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23f59e0b" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="%23f59e0b"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Theme stylesheet — swapped by the theme switcher; each theme file is self-contained -->
    <link id="theme-style" rel="stylesheet" href="themes/neobrutalism.css" />
    <script>
      // Apply the saved theme + background mode before first paint to avoid a flash
      const savedTheme = localStorage.getItem("wa-theme");
      if (savedTheme === "glassmorphism" || savedTheme === "neobrutalism") {
        // ?v= busts the browser cache so CSS edits always show up
        document.getElementById("theme-style").href = `themes/${savedTheme}.css?v=${Date.now()}`;
      }
      document.documentElement.dataset.bg =
        localStorage.getItem("weather-bg") === "gradient" ? "gradient" : "image";
    </script>
  </head>
  <body>
    <div id="loadScreen" class="loader" role="status" aria-label="Loading weather data">
      <div class="spinner"></div>
    </div>

    <div class="app">
      <header class="topbar">
        <p class="brand">
          <svg class="icon brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" /><path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" /><path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
          </svg>
          Weather App
        </p>

        <form id="searchForm" class="search" role="search">
          <svg class="icon search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <label class="sr-only" for="search">City name</label>
          <input id="search" type="search" placeholder="Search for a city…" autocomplete="off" />
          <button id="searchBtn" class="searchBtn" type="submit" aria-label="Search">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </button>
        </form>

        <button id="themeBtn" class="themeBtn" type="button" aria-label="Switch theme">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
          </svg>
          <span id="themeLabel">Neo</span>
        </button>

        <button id="bgBtn" class="bgBtn" type="button" aria-label="Toggle background image" aria-pressed="false" title="Toggle background image">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
        </button>
      </header>

      <p id="error" class="error" role="alert" hidden></p>

      <main class="layout">
        <section id="main" class="card hero-card" aria-label="Current weather"></section>

        <section class="card conditions-card" aria-labelledby="conditions-title">
          <h2 id="conditions-title" class="card-title">Air conditions</h2>
          <div id="condition_elements" class="conditions-grid"></div>
        </section>

        <aside class="card forecast-card" aria-labelledby="forecast-title">
          <h2 id="forecast-title" class="card-title">7-day forecast</h2>
          <div id="elements" class="forecast-list"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
