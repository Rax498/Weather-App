<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⛅ WEATHER APP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- <h1>weather app</h1> -->
    <div id="loadScreen">
      <div class="spinner"></div>
    </div>
    <div class="container">
      <div class="navbar grid_box">
        <div class="searchBar">
          <input id="search" type="text" placeholder="Enter city name" />
          <button id="searchBtn" class="searchBtn">🍳</button>
        </div>
      </div>
      <div class="weakly_forecast grid_box">
        <span class="nameTag"> 7-DAY-FORECAST</span>
        <div id="elements" class="elements">elements</div>
      </div>
      <div id="main" class="main grid_box">mainSection</div>
      <div class="condition grid_box">
        <span class="nameTag">AIR CONDITIONS</span>
        <div id="condition_elements">conditions</div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
